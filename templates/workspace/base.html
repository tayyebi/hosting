{{define "workspace-base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Workspace.Name}} — {{.Tenant.Name}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <link rel="stylesheet" href="/static/css/additions.css" />
    <script>
        (function(){
            var t = localStorage.getItem('platform_theme') || 'light';
            var r = t === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
            document.documentElement.setAttribute('data-theme', r);
        })();
    </script>
</head>
<body class="dashboard-body">
    {{template "workspace-shell" .}}
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
{{end}}
