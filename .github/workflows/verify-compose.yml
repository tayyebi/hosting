name: Verify Compose Stack

on:
  push:
    branches: [arena/fb13a1a8-hosting]

jobs:
  verify-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Boot stack with compose.yaml
        run: |
          set -euo pipefail
          chmod +x scripts/db-init.sh
          docker compose config >/dev/null
          docker compose up -d --wait
          docker compose ps

      - name: Verify port 8021, passwordless DB, and internal network isolation
        run: |
          set -euo pipefail

          # 1. Verify /healthz on 8021
          HEALTH="$(curl -fsS http://127.0.0.1:8021/healthz)"
          echo "::notice::/healthz => ${HEALTH}"
          echo "${HEALTH}" | grep -q '"status":"ok"'
          echo "${HEALTH}" | grep -q '"db":"ok"'

          # 2. Verify login page on GET / (200) and seeded sysadmin authentication
          ROOT_CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8021/)"
          echo "::notice::GET / HTTP status => ${ROOT_CODE}"
          [ "${ROOT_CODE}" = "200" ]

          AUTH_CODE="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8021/api/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"sysadmin@platform.io","password":"sysadmin123"}')"
          echo "::notice::POST /api/login HTTP status => ${AUTH_CODE}"
          [ "${AUTH_CODE}" = "200" ]

          # 3. Verify PostgreSQL container is strictly on an internal:true network with zero published ports
          PG_CID="$(docker compose ps -q postgres)"
          PG_PORTS="$(docker inspect -f '{{json .HostConfig.PortBindings}}' "${PG_CID}")"
          PG_NETS="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "${PG_CID}")"
          echo "::notice::Postgres PortBindings=${PG_PORTS} Networks=${PG_NETS}"
          [ "${PG_PORTS}" = "{}" ] || [ "${PG_PORTS}" = "null" ]

          for NET in ${PG_NETS}; do
            IS_INTERNAL="$(docker network inspect -f '{{.Internal}}' "${NET}")"
            echo "::notice::Network ${NET} Internal=${IS_INTERNAL}"
            [ "${IS_INTERNAL}" = "true" ]
          done

          # 4. Verify only web port 8021 is published by app container
          APP_CID="$(docker compose ps -q app)"
          APP_PORTS="$(docker inspect -f '{{json .HostConfig.PortBindings}}' "${APP_CID}")"
          echo "::notice::App PortBindings=${APP_PORTS}"
          echo "${APP_PORTS}" | grep -q '8021'

      - name: Tear down stack
        if: always()
        run: docker compose down -v
