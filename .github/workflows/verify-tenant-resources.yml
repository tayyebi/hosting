name: Verify Tenant Resources & IP Pool

on:
  workflow_dispatch:
  push:
    branches:
      - arena/a674b0c9-hosting

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go Vet, Build & Unit Tests
        run: |
          set -euo pipefail
          go vet ./...
          go build ./...
          go test -v ./...
          echo "::notice title=GoTests::go vet, go build, and go test passed"

      - name: Live Compose + Migration 0045 + Tenant Resources E2E
        run: |
          set -euo pipefail
          docker compose up -d --build
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8021/healthz | grep -q '"status":"ok"'; then
              break
            fi
            sleep 2
          done
          HEALTH=$(curl -fsS http://127.0.0.1:8021/healthz)
          echo "::notice title=Healthz::${HEALTH}"

          # 1. Login as seeded sysadmin
          COOKIES=$(mktemp)
          LOGIN_CODE=$(curl -sS -o /tmp/login.json -w '%{http_code}' -c "$COOKIES" \
            -H 'Content-Type: application/json' \
            -d '{"email":"tayyebimohammadreza@gmail.com","password":"sysadmin123"}' \
            http://127.0.0.1:8021/api/login)
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "::error title=LoginFailed::status=${LOGIN_CODE} body=$(cat /tmp/login.json)"
            exit 1
          fi

          # 2. Verify /s/ redirects to /s/tenants/ and /s/infrastructure/ is removed
          S_LOC=$(curl -sS -I -b "$COOKIES" http://127.0.0.1:8021/s/ | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
          if [ "$S_LOC" != "/s/tenants/" ]; then
            echo "::error title=SysadminRedirect::expected /s/tenants/, got ${S_LOC}"
            exit 1
          fi
          INFRA_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIES" http://127.0.0.1:8021/s/infrastructure/)
          if [ "$INFRA_CODE" = "200" ]; then
            echo "::error title=SysadminInfraStillExists::expected non-200 for /s/infrastructure/, got 200"
            exit 1
          fi

          # 3. Create two tenants (provider-a and provider-b)
          curl -fsS -b "$COOKIES" -H 'Content-Type: application/json' \
            -d '{"name":"Provider Alpha","slug":"provider-a","domain":"provider-a.io"}' \
            http://127.0.0.1:8021/api/sysadmin/tenants > /tmp/ta.json
          curl -fsS -b "$COOKIES" -H 'Content-Type: application/json' \
            -d '{"name":"Provider Beta","slug":"provider-b","domain":"provider-b.io"}' \
            http://127.0.0.1:8021/api/sysadmin/tenants > /tmp/tb.json

          # 4. Onboard a Linux Nested VPS host + manual assignable IPs onto provider-a
          HOST_RES=$(curl -fsS -b "$COOKIES" -H 'Content-Type: application/json' \
            -d '{"name":"fsn1-kvm-01","hostname_or_ip":"203.0.113.50","ssh_port":22,"ssh_user":"root","driver_kind":"linux_nested_qemu","ownership_type":"rented","region_slug":"eu-central-1","cpu_cores":16,"ram_mb":32768,"disk_gb":320,"monthly_cost_cents":2900,"auto_provision":false}' \
            http://127.0.0.1:8021/api/tenant/provider-a/resources/hosts)
          echo "::notice title=CreatedHost::${HOST_RES}"

          IP_RES=$(curl -fsS -b "$COOKIES" -H 'Content-Type: application/json' \
            -d '{"ips":["198.51.100.20/24","198.51.100.21/24"],"gateway":"198.51.100.1","monthly_cost_cents":100,"retail_price_cents":250,"notes":"RIPE block"}' \
            http://127.0.0.1:8021/api/tenant/provider-a/resources/hosts/1/ips)
          echo "::notice title=CreatedIPs::${IP_RES}"

          # 5. Verify tenant isolation: provider-b sees 0 hosts and 0 IPs
          TB_HOSTS=$(curl -fsS -b "$COOKIES" http://127.0.0.1:8021/api/tenant/provider-b/resources/hosts)
          echo "$TB_HOSTS" | grep -q '"total":0'
          TB_IPS=$(curl -fsS -b "$COOKIES" http://127.0.0.1:8021/api/tenant/provider-b/resources/ips)
          echo "$TB_IPS" | grep -q '"total":0'

          # 6. Verify /t/provider-a/resources/ HTML renders host, drawer, IP pool, and zero DummyProvider
          HTML_DRAWER=$(curl -fsS -b "$COOKIES" "http://127.0.0.1:8021/t/provider-a/resources/?host=1")
          echo "$HTML_DRAWER" | grep -q "fsn1-kvm-01"
          echo "$HTML_DRAWER" | grep -q "198.51.100.20/24"
          echo "$HTML_DRAWER" | grep -q "Auto-Provision QEMU/KVM"
          if echo "$HTML_DRAWER" | grep -q "DummyProvider"; then
            echo "::error title=DummyFound::DummyProvider found in rendered HTML"
            exit 1
          fi
          echo "::notice title=E2ESuccess::Tenant resources UI, API, IP pools, and DB isolation verified end-to-end!"

      - name: Dump compose logs on failure
        if: failure()
        run: |
          LOG_TAIL=$(docker compose logs --no-color --tail=80 app postgres | tr '\n' ' ' | cut -c1-900)
          echo "::error title=ComposeLogs::${LOG_TAIL}"
